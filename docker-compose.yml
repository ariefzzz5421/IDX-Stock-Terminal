services:
  postgres:
    image: postgres:18-alpine
    container_name: idx-terminal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: idx
      POSTGRES_PASSWORD: idx
      POSTGRES_DB: idx_terminal
    ports:
      - "5432:5432"
    volumes:
      - idx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idx -d idx_terminal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  idx-pgdata:
